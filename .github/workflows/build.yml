name: Build

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore AssetManagementModule.sln -ConfigFile NuGet.Config -NonInteractive

      - name: Build solution
        shell: pwsh
        run: msbuild AssetManagementModule.sln /t:Build /p:Configuration=Release /p:ResolveNuGetPackages=false /v:minimal /m

      - name: Run unit tests
        shell: pwsh
        run: dotnet test tests/AssetManagement.Tests/AssetManagement.Tests.csproj -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/AssetManagement.Tests/TestResults/**/*.trx
          if-no-files-found: ignore
